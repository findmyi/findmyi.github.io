<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0}</style>
</head><body><iframe id="f" src="/index.html"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>{
  f.contentWindow.location.hash='#/p/zhun';
  setTimeout(()=>{
    const d=f.contentDocument;
    const el=d.querySelector('.paywall');
    if(el){const r=el.getBoundingClientRect();
      d.documentElement.style.marginTop=(-(r.top+d.documentElement.scrollTop-10))+'px';}
  },2600);
});
</script></body></html>
