name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        # ⚠️ 只发布站点本体。
        # 绝不能整仓发布 —— content/ 里是付费深度正文（含 depth），
        # build/ 里有密钥生成器，都不该出现在公网。
        run: |
          set -e
          mkdir -p _site
          cp -r index.html assets articles data _site/
          # 法务页面（Google OAuth 发布需要隐私政策与服务条款链接）
          [ -f privacy.html ] && cp privacy.html _site/ || true
          [ -f terms.html ] && cp terms.html _site/ || true
          # 404 与其它静态资源（若存在）
          [ -f 404.html ] && cp 404.html _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
          echo "── 待发布文件 ──"
          find _site -type f | sort | head -50
          echo "文件总数: $(find _site -type f | wc -l)"
          echo "── 安全检查：确认付费正文未混入 ──"
          if grep -rl "坤雖臣道\|坤虽臣道" _site/ 2>/dev/null; then
            echo "❌ 付费正文泄露，终止部署"; exit 1
          fi
          echo "✓ 未发现付费正文"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
